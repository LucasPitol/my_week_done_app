name: my_week_done_app
description: "Tracker de rotina fixa recorrente — My Week Done."
publish_to: 'none'

version: 1.1.1+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_tabler_icons: ^1.43.0
  google_fonts: ^6.2.1
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  in_app_review: ^2.0.10
  qr_flutter: ^4.1.0

dependency_overrides:
  # path_provider_foundation 2.6.0+ usa FFI objective_c que falha no simulador iOS.
  # Ver: https://github.com/flutter/flutter/issues/186794
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#1C2127"
  adaptive_icon_foreground: assets/icons/app_icon.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#1C2127"
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#1C2127"
    theme_color: "#1C2127"
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icons/app_icon.png

flutter:
  uses-material-design: true

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Variable.ttf
        - asset: assets/fonts/satoshi/Satoshi-VariableItalic.ttf
          style: italic
